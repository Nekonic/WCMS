
services:
  # WCMS 서버 (Flask)
  wcms-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: wcms-server
    ports:
      - "5050:5050"
    environment:
      - WCMS_ENV=production
      - WCMS_SECRET_KEY=${WCMS_SECRET_KEY:-change-this-in-production}
      - WCMS_HOST=0.0.0.0
      - WCMS_PORT=5050
      - WCMS_DB_PATH=/app/db/wcms.sqlite3
      - WCMS_LOG_LEVEL=INFO
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    networks:
      - wcms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  wcms-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
